name: Relatório Mensal — Referência de Horas (dia 1º, 8h)

on:
  schedule:
    - cron: '0 11 1 * *'   # todo dia 1º às 8h BRT (UTC-3)
  workflow_dispatch:
    inputs:
      ate:
        description: "Último mês incluído, AAAA-MM (vazio = mês anterior)"
        required: false

jobs:
  relatorio-mensal-horas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rodar relatório mensal de horas
        env:
          NOTION_TOKEN:       ${{ secrets.NOTION_TOKEN }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_DESTINO:      ${{ secrets.EMAIL_DESTINO }}
          ATE:                ${{ inputs.ate }}
        run: |
          if [ -n "$ATE" ]; then
            python relatorio_mensal_horas.py --ate "$ATE"
          else
            python relatorio_mensal_horas.py
          fi
